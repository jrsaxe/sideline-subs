<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subs">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sideline Subs</title>
<style>
:root {
  --bg: #f2f4f3; --card: #fff; --ink: #14201a; --muted: #5d6b64; --line: #d9dfdc;
  --brand: #0f5132; --brand-ink: #fff; --accent: #f5b301; --danger: #c0392b; --good: #1e7d46;
  --pitch: #2e8b47; --pitch-line: rgba(255,255,255,.55); --sel: #ffd84d;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1210; --card: #18201c; --ink: #e8efeb; --muted: #9aa8a1; --line: #2b3631; --brand: #1f8a55; --pitch: #22683a; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
body { padding-top: var(--safe-t); padding-bottom: calc(64px + var(--safe-b)); -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
button { font: inherit; border: 0; border-radius: 12px; padding: 12px 14px; background: var(--line); color: var(--ink); font-weight: 600; touch-action: manipulation; }
button:active { transform: scale(.97); opacity: .85; }
button.primary { background: var(--brand); color: var(--brand-ink); }
button.accent { background: var(--accent); color: #1b1300; }
button.danger { background: var(--danger); color: #fff; }
button.ghost { background: transparent; border: 1.5px solid var(--line); }
button.small { padding: 8px 10px; font-size: 14px; border-radius: 10px; }
button:disabled { opacity: .4; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; -webkit-user-select: text; user-select: text; }
main { padding: 10px 12px 16px; max-width: 560px; margin: 0 auto; }
h2 { font-size: 20px; margin: 6px 2px 10px; }
h3 { font-size: 15px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.seg { display: flex; background: var(--line); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; background: transparent; padding: 9px 6px; font-size: 14px; }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

/* clock bar */
.clockbar { display: flex; align-items: center; gap: 10px; background: var(--brand); color: #fff; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; }
.clockbar .time { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.clockbar .time.over { color: var(--accent); }
.clockbar .lbl { font-size: 12px; opacity: .85; }
.clockbar button { background: rgba(255,255,255,.18); color: #fff; }
.clockbar button.go { background: #fff; color: var(--brand); }

.banner { background: var(--accent); color: #1b1300; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; }

/* pitch */
.pitch { position: relative; width: 100%; aspect-ratio: 5 / 5.6; max-height: 56vh; margin: 0 auto 12px; background: var(--pitch); border-radius: 16px; overflow: hidden;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 12.5%, transparent 12.5% 25%); }
.pitch .mark { position: absolute; border: 2px solid var(--pitch-line); }
.pitch .half { left: 0; right: 0; top: -2px; height: 0; border-width: 2px 0 0; }
.pitch .circle { width: 26%; aspect-ratio: 1; left: 37%; top: -13%; border-radius: 50%; }
.pitch .box { left: 25%; right: 25%; bottom: -2px; height: 18%; }
.chip { position: absolute; transform: translate(-50%, -50%); width: 25%; min-width: 74px; max-width: 108px; background: #fff; color: #14201a; border-radius: 12px; padding: 5px 4px 4px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); border: 3px solid transparent; }
.chip .pos { font-size: 10px; font-weight: 800; color: #0f5132; letter-spacing: .05em; }
.chip .nm { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .mn { font-size: 12px; color: #5d6b64; font-variant-numeric: tabular-nums; }
.chip.empty { background: rgba(255,255,255,.25); color: #fff; border: 2px dashed #fff; }
.chip.empty .pos { color: #fff; }
.chip.sel { border-color: var(--sel); box-shadow: 0 0 0 4px rgba(255,216,77,.6); }
.chip.target { border-color: var(--sel); border-style: dashed; }
.chip .q { position: absolute; left: 50%; bottom: -16px; transform: translateX(-50%); white-space: nowrap; background: var(--accent); color: #1b1300; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 1px 6px; }
.chip .lock { position: absolute; right: -8px; top: -8px; font-size: 14px; }
.gklock { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; padding: 7px 10px; }
.gklock.on { background: var(--accent); color: #1b1300; }
.formtag { position: absolute; right: 8px; bottom: 8px; color: #fff; font-size: 12px; opacity: .8; }

/* bench + queue */
.bench { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.bp { background: var(--bg); border: 3px solid transparent; border-radius: 12px; padding: 8px; text-align: left; }
.bp .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp .mn { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bp.sel { border-color: var(--sel); }
.bp.queued { opacity: .6; }
.bp .qtag { font-size: 11px; font-weight: 800; color: #8a6400; }
.qrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.qrow:first-of-type { border-top: 0; }
.qrow .who { flex: 1; min-width: 0; }
.qrow .in { font-weight: 800; font-size: 17px; }
.qrow .pos { display: inline-block; background: var(--brand); color: #fff; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 800; margin: 0 4px; vertical-align: 2px; }
.qrow .out { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .x { background: transparent; color: var(--muted); padding: 8px; font-size: 18px; }
.qrow button.made { background: var(--good); color: #fff; padding: 12px 12px; }
.qactions { display: flex; gap: 8px; margin-top: 10px; }
.qactions button { flex: 1; padding: 14px 10px; }

/* action bar */
.actionbar { position: fixed; left: 8px; right: 8px; bottom: calc(70px + var(--safe-b)); background: #14201a; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 20; max-width: 544px; margin: 0 auto; }
.actionbar .msg { flex: 1; font-size: 14px; }
.actionbar button { background: rgba(255,255,255,.15); color: #fff; }
.actionbar button.danger { background: var(--danger); }

/* tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); z-index: 10; }
nav.tabs button { flex: 1; background: transparent; border-radius: 0; padding: 10px 0 12px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button .ic { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--brand); }

/* roster + minutes */
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .nm { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow.absent .nm { color: var(--muted); text-decoration: line-through; }
.toggle { width: 56px; height: 32px; border-radius: 16px; padding: 0; position: relative; background: var(--line); flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.toggle.on { background: var(--good); }
.toggle.on::after { left: 27px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; position: relative; margin-top: 4px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); border-radius: 4px; }
.bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.delta { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; min-width: 52px; text-align: right; }
.delta.neg { color: var(--danger); } .delta.pos { color: var(--good); }
.status { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--muted); }
.status.on { background: var(--brand); color: #fff; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.empty-state { text-align: center; padding: 26px 12px; }
.empty-state .big { font-size: 46px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin: -4px 0 10px; }
</style>
</head>
<body>
<main id="view"></main>
<div id="actionbar"></div>
<nav class="tabs" id="tabs"></nav>

<script src="engine.js"></script>
<script>
'use strict';
const E = window.Engine;
const KEY = 'subplanner.v1';
const qs = new URLSearchParams(location.search);
const SPEED = Math.max(1, +(qs.get('speed') || 1));
// debug fast-forward (?speed=30): keep the same epoch across reloads so stored times stay valid
const T0 = (() => {
  if (SPEED === 1) return Date.now();
  try { const v = +localStorage.getItem('subplanner.t0'); if (v) return v; localStorage.setItem('subplanner.t0', Date.now()); } catch (e) {}
  return Date.now();
})();
const now = () => (SPEED === 1 ? Date.now() : T0 + (Date.now() - T0) * SPEED);

// ---------- state ----------
function defaults() {
  return { v: 1, roster: [], settings: { formation: '7', halfMin: 25, subEvery: 6, minStint: 3 }, game: null, history: [], tab: 'game' };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 1) return Object.assign(defaults(), s);
  } catch (e) {}
  return defaults();
}
let S = load();
const ui = { sel: null, undo: [], showMenu: false };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const G = () => S.game;
const t = () => (S.game ? E.gameMs(S.game, now()) : 0);
const P = (id) => S.roster.find((p) => p.id === id) || { id, name: '?' };
const nm = (id) => esc(P(id).name);
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmt(ms) { ms = Math.max(0, Math.round(ms / 1000)); return Math.floor(ms / 60) + ':' + String(ms % 60).padStart(2, '0'); }
function fmtSigned(ms) { return (ms < 0 ? '−' : '+') + fmt(Math.abs(ms)); }
function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// every lineup/sub action is undoable; clock is never rewound by undo
function act(fn, undoable = true) {
  if (undoable && S.game) {
    ui.undo.push(JSON.stringify({ game: S.game, roster: S.roster }));
    if (ui.undo.length > 30) ui.undo.shift();
  }
  fn();
  save();
  render();
}
function undo() {
  const snap = ui.undo.pop();
  if (!snap || !S.game) return;
  const s = JSON.parse(snap);
  s.game.clock = S.game.clock;
  s.game.halfStarts = S.game.halfStarts;
  s.game.phase = S.game.phase;
  s.game.half = S.game.half;
  S.game = s.game;
  S.roster = s.roster;
  ui.sel = null;
  save();
  render();
}
const engineOpts = () => ({ history: S.history, minStintMs: S.settings.minStint * 60000 });
const isLive = () => G() && G().phase === 'live';
const isLineup = () => G() && (G().phase === 'pre' || G().phase === 'half');

// ---------- rendering ----------
const view = document.getElementById('view');
function render() {
  renderTabs();
  if (S.tab === 'roster') view.innerHTML = rosterView();
  else if (S.tab === 'minutes') view.innerHTML = minutesView();
  else view.innerHTML = gameView();
  renderActionBar();
}

function renderTabs() {
  const tabs = [['game', '⚽', 'Game'], ['minutes', '⏱', 'Minutes'], ['roster', '👥', 'Roster']];
  document.getElementById('tabs').innerHTML = tabs
    .map(([k, ic, l]) => `<button data-a="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}"><span class="ic">${ic}</span>${l}</button>`)
    .join('');
}

function gameView() {
  const g = G();
  if (!g) return newGameView();
  if (g.phase === 'final') return finalView();
  let h = '';
  h += clockBar();
  if (isLive()) h += reminder();
  if (isLineup()) {
    h += `<div class="card"><div class="row" style="margin-bottom:10px">
      <div class="seg grow">${['7', '8'].map((f) => `<button data-a="formation" data-v="${f}" class="${g.formation === f ? 'on' : ''}">${f}v${f}</button>`).join('')}</div>
      </div>
      <div class="row"><button class="ghost grow" data-a="populate">🔀 Populate positions</button>
      <button class="primary grow" data-a="kickoff">${g.phase === 'pre' ? '▶ Kick off' : '▶ Start 2nd half'}</button></div></div>`;
    h += `<div class="hint">Lineup mode · tap two players to swap them</div>`;
  }
  // when subs are queued, show them first so "Sub Made" is right under your thumb
  const queued = isLive() && g.queue.length;
  if (queued) h += queueCard();
  h += pitch();
  if (isLive() && !queued) h += queueCard();
  h += benchCard();
  if (ui.undo.length) h += `<div class="row" style="justify-content:center"><button class="ghost small" data-a="undo">↶ Undo last change</button></div>`;
  return h;
}

function newGameView() {
  const present = S.roster.filter((p) => p.present).length;
  if (!S.roster.length)
    return `<div class="card empty-state"><div class="big">👥</div><h2>Add your roster first</h2>
      <p class="muted">Go to the Roster tab and paste in your players' names.</p>
      <button class="primary" data-a="tab" data-v="roster">Go to Roster</button></div>`;
  const f = S.settings.formation;
  return `<div class="card empty-state"><div class="big">⚽</div><h2>New game</h2>
    <p class="muted">${present} of ${S.roster.length} players marked present.<br>Mark absences on the Roster tab (you can change it any time).</p>
    <div class="seg" style="margin:12px 0">${['7', '8'].map((x) => `<button data-a="setformation" data-v="${x}" class="${f === x ? 'on' : ''}">${E.FORMATIONS[x].label}</button>`).join('')}</div>
    <button class="primary" style="width:100%" data-a="newgame">Set up lineup</button></div>`;
}

function clockBar() {
  const g = G();
  const tt = t();
  const hc = E.halfClockMs(g, now());
  const halfLen = S.settings.halfMin * 60000;
  const running = g.clock.since != null;
  let btns = '';
  if (g.phase === 'live') {
    btns = running ? `<button data-a="pause">⏸ Pause</button>` : `<button class="go" data-a="resume">▶ Resume</button>`;
    btns += `<button data-a="menu">⋯</button>`;
  }
  let lbl = g.phase === 'pre' ? 'Pre-game' : g.phase === 'half' ? 'Halftime' : `${g.half === 1 ? '1st' : '2nd'} half${running ? '' : ' · paused'}`;
  let h = `<div class="clockbar"><div class="grow"><div class="lbl">${lbl} · ${E.FORMATIONS[g.formation].label}</div>
    <div class="time ${hc > halfLen ? 'over' : ''}" id="clock">${fmt(hc)}<span style="font-size:15px;opacity:.7;font-weight:600"> / ${S.settings.halfMin}:00</span></div></div>${btns}</div>`;
  if (ui.showMenu && g.phase === 'live') {
    h += `<div class="card"><div class="row wrap">
      ${g.half === 1 ? `<button class="grow" data-a="endhalf">End 1st half</button>` : `<button class="danger grow" data-a="endgame">End game</button>`}
      <button class="ghost grow" data-a="formation" data-v="${g.formation === '7' ? '8' : '7'}">Switch to ${g.formation === '7' ? '8v8' : '7v7'}</button>
      </div><div class="tiny muted" style="margin-top:8px">Game time ${fmt(tt)}</div></div>`;
  }
  return h;
}

function reminder() {
  const g = G();
  if (g.queue.length || g.clock.since == null) return '';
  const since = t() - g.lastSubAt;
  if (since < S.settings.subEvery * 60000 || !E.benchIds(g, S.roster).length) return '';
  return `<div class="banner"><span class="grow">⏱ ${fmt(since)} since last sub</span><button class="small" style="background:#1b1300;color:#fff" data-a="suggest">Suggest subs</button></div>`;
}

function pitch() {
  const g = G();
  const tt = t();
  const qBySlot = {};
  g.queue.forEach((r) => {
    qBySlot[r.slot] = r;
    if (r.swap) qBySlot[r.slot2] = r;
  });
  const selSlot = ui.sel && ui.sel.kind === 'slot' ? ui.sel.id : null;
  const benchSel = ui.sel && ui.sel.kind === 'bench';
  let h = `<div class="pitch"><div class="mark half"></div><div class="mark circle"></div><div class="mark box"></div>`;
  for (const s of E.slotDefs(g.formation)) {
    const pid = g.slots[s.id];
    const q = qBySlot[s.id];
    const cls = ['chip'];
    if (pid == null) cls.push('empty');
    if (selSlot === s.id) cls.push('sel');
    else if (benchSel || selSlot) cls.push('target');
    h += `<div class="${cls.join(' ')}" style="left:${s.x}%;top:${s.y}%" data-a="slot" data-v="${s.id}">
      <div class="pos">${s.id}</div>
      <div class="nm">${pid != null ? nm(pid) : 'empty'}</div>
      ${pid != null ? `<div class="mn" data-ms="${pid}">${fmt(E.playedMs(g, pid, tt))}</div>` : '<div class="mn">&nbsp;</div>'}
      ${s.id === 'GK' && g.gkLock ? '<span class="lock">🔒</span>' : ''}
      ${q ? `<div class="q">${q.swap ? `↔ ${q.slot === s.id ? q.slot2 : q.slot}` : `⇄ ${nm(q.inPid)}`}</div>` : ''}
    </div>`;
  }
  h += `<button class="gklock ${g.gkLock ? 'on' : ''}" data-a="gklock">${g.gkLock ? '🔒 GK locked' : '🔓 GK subs on'}</button>`;
  h += `</div>`;
  return h;
}

function queueCard() {
  const g = G();
  const tt = t();
  E.normalizeQueue(g, S.roster);
  const bench = E.benchIds(g, S.roster);
  let h = `<div class="card"><h3>Subs queue ${g.queue.length ? `(${g.queue.length})` : ''}</h3>`;
  if (!g.queue.length)
    h += `<div class="muted tiny" style="padding:4px 0 2px">Nobody queued. Tap <b>Suggest subs</b>, or tap a bench player then a spot on the field.</div>`;
  for (const r of g.queue) {
    if (r.swap) {
      const a = g.slots[r.slot];
      const b = g.slots[r.slot2];
      h += `<div class="qrow"><div class="who">
        <div class="in">${nm(a)} ↔ ${nm(b)}</div>
        <div class="out">swap ${r.slot} ↔ ${r.slot2}</div></div>
        <button class="x" data-a="unqueue" data-v="${r.slot}" aria-label="Remove">✕</button>
        <button class="made" data-a="made" data-v="${r.slot}">Swap Made</button></div>`;
      continue;
    }
    const out = g.slots[r.slot];
    h += `<div class="qrow"><div class="who">
      <div class="in">${nm(r.inPid)}<span class="pos">${r.slot}</span>${r.manual ? '<span class="tiny muted">manual</span>' : ''}</div>
      <div class="out">${out != null ? `for ${nm(out)} · ${fmt(E.playedMs(g, out, tt))} played` : 'fills empty spot'}</div></div>
      <button class="x" data-a="unqueue" data-v="${r.slot}" aria-label="Remove">✕</button>
      <button class="made" data-a="made" data-v="${r.slot}">Sub Made</button></div>`;
  }
  h += `<div class="qactions"><button class="accent" data-a="suggest" ${bench.length ? '' : 'disabled'}>✨ Suggest subs</button>
    <button class="primary" data-a="allmade" ${g.queue.length ? '' : 'disabled'}>✅ All Subs Made${g.queue.length ? ` (${g.queue.length})` : ''}</button></div></div>`;
  return h;
}

function benchCard() {
  const g = G();
  const tt = t();
  const bench = E.benchIds(g, S.roster).sort((a, b) => E.playedMs(g, a, tt) - E.playedMs(g, b, tt));
  const queued = {};
  g.queue.forEach((r) => { if (!r.swap) queued[r.inPid] = r.slot; });
  let h = `<div class="card"><h3>Bench (${bench.length})</h3>`;
  if (!bench.length) h += `<div class="muted tiny">Everyone's on the field.</div>`;
  h += `<div class="bench">`;
  for (const pid of bench) {
    const sel = ui.sel && ui.sel.kind === 'bench' && ui.sel.id === pid;
    h += `<button class="bp ${sel ? 'sel' : ''} ${queued[pid] ? 'queued' : ''}" data-a="bench" data-v="${pid}">
      <div class="nm">${nm(pid)}</div>
      <div class="mn">played ${fmt(E.playedMs(g, pid, tt))}${g.phase !== 'pre' ? `<br>sat ${fmt(E.benchMs(g, pid, tt))}` : ''}</div>
      ${queued[pid] ? `<div class="qtag">→ ${queued[pid]}</div>` : ''}</button>`;
  }
  h += `</div></div>`;
  return h;
}

function finalView() {
  return `<div class="card empty-state"><div class="big">🏁</div><h2>Game over</h2><p class="muted">Minutes are saved and will help rotate starters next game.</p>
    <div class="row"><button class="ghost grow" data-a="tab" data-v="minutes">See minutes</button><button class="primary grow" data-a="newgame">New game</button></div></div>`;
}

function minutesView() {
  const g = G();
  if (!g) {
    return `<div class="card empty-state"><div class="big">⏱</div><p class="muted">Minutes show up once a game starts.</p>${historyList()}</div>`;
  }
  const tt = t();
  const fair = E.fairShareMs(g, S.roster, tt);
  const on = new Set(E.onFieldIds(g));
  const avail = new Set(E.available(g, S.roster));
  const rows = S.roster
    .map((p) => ({ p, ms: E.playedMs(g, p.id, tt) }))
    .filter((r) => avail.has(r.p.id) || r.ms > 0)
    .sort((a, b) => a.ms - b.ms);
  const max = Math.max(fair, ...rows.map((r) => r.ms), 1);
  let h = `<div class="card"><div class="row"><div class="grow"><h3 style="margin:0">Playing time</h3>
    <div class="tiny muted">Game time ${fmt(tt)} · fair share ≈ ${fmt(fair)} each</div></div></div></div><div class="card">`;
  for (const { p, ms } of rows) {
    const l = E.lineMs(g, p.id, tt);
    const lines = E.LINES.filter((k) => Math.round(l[k] / 60000) > 0).map((k) => `${k} ${Math.round(l[k] / 60000)}`).join(' · ') || '—';
    const d = ms - fair;
    const st = !avail.has(p.id) ? '<span class="status">OUT</span>' : g.phase === 'final' ? '' : on.has(p.id) ? '<span class="status on">ON</span>' : '<span class="status">BENCH</span>';
    h += `<div class="prow" style="display:block"><div class="row"><span class="nm" style="flex:1">${esc(p.name)}</span>${st}
      <span style="font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;text-align:right">${fmt(ms)}</span>
      <span class="delta ${d < -60000 ? 'neg' : d > 60000 ? 'pos' : ''}">${fmtSigned(d)}</span></div>
      <div class="bar"><i style="width:${(ms / max) * 100}%"></i><b style="left:${(fair / max) * 100}%"></b></div>
      <div class="tiny muted" style="margin-top:3px">${lines} · ${E.stintCount(g, p.id)} stint${E.stintCount(g, p.id) === 1 ? '' : 's'}</div></div>`;
  }
  h += `</div>`;
  return h;
}

function historyList() {
  if (!S.history.length) return '';
  return `<div class="tiny muted" style="margin-top:12px">${S.history.length} past game${S.history.length > 1 ? 's' : ''} saved</div>`;
}

function rosterView() {
  const g = G();
  const st = S.settings;
  let h = `<div class="card"><h3>Roster · ${S.roster.filter((p) => p.present && !(g && g.out.includes(p.id))).length} available</h3>`;
  if (!S.roster.length) h += `<div class="muted tiny">No players yet.</div>`;
  S.roster.forEach((p, i) => {
    const out = g && g.out.includes(p.id);
    const avail = p.present && !out;
    h += `<div class="prow ${avail ? '' : 'absent'}"><span class="nm">${esc(p.name)}${out ? ' <span class="tiny muted">(out for game)</span>' : ''}</span>
      <button class="small ghost" data-a="rename" data-v="${p.id}">✎</button>
      <button class="toggle ${avail ? 'on' : ''}" data-a="present" data-v="${p.id}" aria-label="Present"></button></div>`;
  });
  h += `<div class="tiny muted" style="margin-top:6px">Toggle off = absent. Works mid-game: she comes off and the lineup reflows.</div></div>`;
  h += `<div class="card"><h3>Add players</h3><div class="field"><textarea id="newnames" rows="3" placeholder="One name per line"></textarea></div>
    <button class="primary" style="width:100%" data-a="addnames">Add</button></div>`;
  h += `<div class="card"><h3>Settings</h3>
    <div class="field"><label>Default formation</label><div class="seg">${['7', '8'].map((x) => `<button data-a="setformation" data-v="${x}" class="${st.formation === x ? 'on' : ''}">${E.FORMATIONS[x].label}</button>`).join('')}</div></div>
    <div class="row"><div class="field grow"><label>Half length (min)</label><input type="number" inputmode="numeric" data-set="halfMin" value="${st.halfMin}"></div>
    <div class="field grow"><label>Sub reminder (min)</label><input type="number" inputmode="numeric" data-set="subEvery" value="${st.subEvery}"></div></div>
    <div class="field"><label>Don't suggest pulling a player who's been on less than (min)</label><input type="number" inputmode="numeric" data-set="minStint" value="${st.minStint}"></div>
    </div>`;
  h += `<div class="card"><h3>Data</h3><div class="row wrap">
    ${g ? `<button class="ghost grow" data-a="abandon">Discard current game</button>` : ''}
    <button class="ghost grow" data-a="export">Copy backup</button>
    <button class="ghost grow" data-a="import">Restore backup</button>
    <button class="danger grow" data-a="resetall">Erase everything</button></div>
    <div class="tiny muted" style="margin-top:8px">${S.history.length} past games saved on this phone.</div></div>`;
  return h;
}

function renderActionBar() {
  const el = document.getElementById('actionbar');
  const g = G();
  if (!ui.sel || !g || S.tab !== 'game' || g.phase === 'final') { el.innerHTML = ''; return; }
  const s = ui.sel;
  const pid = s.kind === 'bench' ? s.id : g.slots[s.id];
  let msg;
  if (s.kind === 'bench') msg = `<b>${nm(pid)}</b> — tap a spot on the field to ${isLive() ? 'queue her in' : 'put her there'}`;
  else msg = pid != null ? `<b>${nm(pid)}</b> (${s.id}) — tap a bench player to ${isLive() ? 'queue a sub' : 'swap'}, or another spot to ${isLive() ? 'queue a position swap' : 'swap'}` : `<b>${s.id}</b> empty — tap a bench player`;
  el.innerHTML = `<div class="actionbar"><div class="msg">${msg}</div>
    ${pid != null ? `<button class="danger small" data-a="out" data-v="${pid}">Out for game</button>` : ''}
    <button class="small" data-a="desel">✕</button></div>`;
}

// ---------- interactions ----------
function sendIn(benchPid, slot) {
  const g = G();
  act(() => {
    if (isLive()) E.queueManual(g, S.roster, benchPid, slot);
    else E.placeAt(g, slot, benchPid, t());
    ui.sel = null;
  });
}
function tapSlot(slot) {
  const g = G();
  const s = ui.sel;
  if (s && s.kind === 'bench') return sendIn(s.id, slot);
  if (s && s.kind === 'slot') {
    if (s.id === slot) { ui.sel = null; return render(); }
    // during the game a position swap waits in the queue for confirmation, like a sub
    return act(() => {
      if (isLive()) E.queueSwap(g, S.roster, s.id, slot);
      else E.swapSlots(g, s.id, slot, t());
      ui.sel = null;
    });
  }
  ui.sel = { kind: 'slot', id: slot };
  render();
}
function tapBench(pid) {
  const s = ui.sel;
  if (s && s.kind === 'slot') return sendIn(pid, s.id);
  ui.sel = s && s.kind === 'bench' && s.id === pid ? null : { kind: 'bench', id: pid };
  render();
}

const actions = {
  tab: (v) => { S.tab = v; ui.sel = null; ui.showMenu = false; save(); render(); window.scrollTo(0, 0); },
  setformation: (v) => { S.settings.formation = v; save(); render(); },
  newgame: () => {
    if (!S.roster.some((p) => p.present)) return alert('Mark some players present first.');
    S.game = E.newGame(S.settings.formation);
    ui.undo = [];
    ui.sel = null;
    E.populate(S.game, S.roster, 0, { history: S.history });
    S.tab = 'game';
    save(); render();
  },
  populate: () => act(() => { E.populate(G(), S.roster, t(), { history: S.history, keepGK: G().gkLock }); ui.sel = null; }),
  formation: (v) => act(() => { E.setFormation(G(), S.roster, v, t()); ui.showMenu = false; ui.sel = null; }),
  kickoff: () => {
    const g = G();
    const n = E.onFieldIds(g).length;
    const need = E.slotDefs(g.formation).length;
    if (n < need && !confirm(`Only ${n} of ${need} spots filled. Start anyway?`)) return;
    act(() => {
      if (g.phase === 'half') { g.half = 2; g.halfStarts.push(t()); }
      g.phase = 'live';
      g.lastSubAt = t();
      ui.sel = null;
      E.startClock(g, now());
    }, false);
    ui.undo = [];
    wake();
  },
  pause: () => act(() => E.pauseClock(G(), now()), false),
  resume: () => { act(() => E.startClock(G(), now()), false); wake(); },
  menu: () => { ui.showMenu = !ui.showMenu; render(); },
  endhalf: () => {
    if (!confirm('End the 1st half?')) return;
    act(() => { const g = G(); E.pauseClock(g, now()); g.phase = 'half'; g.queue = []; ui.showMenu = false; }, false);
    ui.undo = [];
  },
  endgame: () => {
    if (!confirm('End the game and save minutes?')) return;
    const g = G();
    E.pauseClock(g, now());
    S.history.push(E.summary(g, S.roster, t()));
    if (S.history.length > 40) S.history.shift();
    g.phase = 'final';
    ui.showMenu = false; ui.undo = [];
    save(); render();
  },
  abandon: () => { if (confirm('Discard the current game? Minutes will not be saved.')) { S.game = null; ui.undo = []; save(); render(); } },
  gklock: () => act(() => {
    const g = G();
    g.gkLock = !g.gkLock;
    if (g.gkLock) g.queue = g.queue.filter((r) => r.slot !== 'GK' || r.manual);
  }),
  slot: tapSlot,
  bench: tapBench,
  desel: () => { ui.sel = null; render(); },
  suggest: () => act(() => {
    const r = E.suggest(G(), S.roster, t(), engineOpts());
    ui.sel = null;
    if (r.leftOnBench.length) toast(`${r.leftOnBench.length} stay on the bench (not enough eligible to come off)`);
  }),
  made: (slot) => act(() => E.applyRow(G(), S.roster, slot, t())),
  allmade: () => act(() => E.applyAll(G(), S.roster, t())),
  unqueue: (slot) => act(() => E.unqueue(G(), slot)),
  undo: undo,
  out: (pid) => {
    if (!confirm(`Take ${P(pid).name} out for the rest of the game?`)) return;
    act(() => { const g = G(); g.out.push(pid); E.removePlayer(g, S.roster, pid, t()); ui.sel = null; });
  },
  present: (pid) => {
    const p = P(pid);
    const g = G();
    const avail = p.present && !(g && g.out.includes(pid));
    const change = () => {
      if (avail) { p.present = false; if (g && g.phase !== 'final') E.removePlayer(g, S.roster, pid, t()); }
      else { p.present = true; if (g) { g.out = g.out.filter((x) => x !== pid); if (g.phase !== 'final') E.reflow(g, S.roster, t()); } }
    };
    if (g) act(change); else { change(); save(); render(); }
  },
  rename: (pid) => {
    const p = P(pid);
    const n = prompt('Name (leave empty to delete player)', p.name);
    if (n === null) return;
    if (!n.trim()) {
      if (S.game && S.game.phase !== 'final') return alert('Finish or discard the current game before deleting players. Toggle her absent instead.');
      if (confirm(`Delete ${p.name}?`)) S.roster = S.roster.filter((x) => x.id !== pid);
    } else p.name = n.trim();
    save(); render();
  },
  addnames: () => {
    const ta = document.getElementById('newnames');
    const names = ta.value.split(/\n|,/).map((s) => s.trim()).filter(Boolean);
    names.forEach((n) => S.roster.push({ id: uid(), name: n, present: true }));
    if (S.game) E.reflow(S.game, S.roster, t());
    save(); render();
  },
  export: async () => {
    const txt = JSON.stringify(S);
    try { await navigator.clipboard.writeText(txt); toast('Backup copied — paste it into Notes'); }
    catch (e) { prompt('Copy this backup text:', txt); }
  },
  import: () => {
    const txt = prompt('Paste backup text');
    if (!txt) return;
    try { const s = JSON.parse(txt); if (s.v !== 1) throw 0; S = Object.assign(defaults(), s); ui.undo = []; save(); render(); toast('Restored'); }
    catch (e) { alert("That doesn't look like a backup."); }
  },
  resetall: () => { if (confirm('Erase roster, games and history from this phone?')) { S = defaults(); ui.undo = []; save(); render(); } },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const fn = actions[el.dataset.a];
  if (fn) fn(el.dataset.v);
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.set;
  if (!k) return;
  const v = parseFloat(e.target.value);
  if (v > 0) { S.settings[k] = v; save(); }
});

function toast(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:#14201a;color:#fff;padding:10px 14px;border-radius:12px;z-index:50;font-size:14px;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

// ---------- ticking: refresh clock + minutes each second while running ----------
setInterval(() => {
  const g = G();
  if (!g || g.clock.since == null) return;
  if (S.tab === 'game') {
    // light update so taps aren't interrupted
    const hc = E.halfClockMs(g, now());
    const c = document.getElementById('clock');
    if (c) c.firstChild.nodeValue = fmt(hc);
    const tt = t();
    document.querySelectorAll('[data-ms]').forEach((el) => (el.textContent = fmt(E.playedMs(g, el.dataset.ms, tt))));
    // full refresh every 10s for bench/queue/reminder
    if (Math.floor(Date.now() / 1000) % 10 === 0) render();
  } else if (S.tab === 'minutes') render();
}, 1000);

// keep the screen awake while the clock runs
let wakeLock = null;
async function wake() {
  try {
    if ('wakeLock' in navigator && G() && G().clock.since != null && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => (wakeLock = null));
    }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wake(); render(); } });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
wake();
</script>
</body>
</html>
